[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This repo is a test suite, not a distributable package: install deps only.
py-modules = []

[project]
name = "deepcheck2-automation-test"
version = "0.1.0"
description = "Automated E2E (UI + API) test suite for deepcheck 2.0, with results streamed to InfluxDB for Grafana dashboards."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "playwright>=1.44",
    "httpx>=0.27",
    "influxdb-client>=1.43",
    "python-dotenv>=1.0",
    "pytest-rerunfailures>=14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure"
markers = [
    "ui: UI end-to-end tests driven by Playwright",
    "api: backend API tests",
    "smoke: critical-path checks suitable for fast feedback",
]
