name: E2E Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_ENV: ${{ vars.TEST_ENV }}
      TEST_USER_L1: ${{ vars.TEST_USER_L1 }}
      TEST_USER_L2: ${{ vars.TEST_USER_L2 }}
      TEST_USER_L3: ${{ vars.TEST_USER_L3 }}
      TEST_USER_L4: ${{ vars.TEST_USER_L4 }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      INFLUX_URL: ${{ secrets.INFLUX_URL }}
      INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
      INFLUX_ORG: ${{ vars.INFLUX_ORG }}
      INFLUX_BUCKET: ${{ vars.INFLUX_BUCKET }}
      GIT_BRANCH: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -v --reruns 1

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
